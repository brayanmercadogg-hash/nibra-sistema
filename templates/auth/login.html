<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIBRA - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: #fafafa;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 48px 36px 36px;
            text-align: center;
        }

        .login-logo {
            font-size: 24px;
            font-weight: 700;
            color: #09090b;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: #a1a1aa;
            margin-bottom: 32px;
        }

        .flash-area {
            margin-bottom: 4px;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .alert-success {
            background: #f4f4f5;
            color: #18181b;
            border: 1px solid #e4e4e7;
        }

        .alert-error,
        .alert-danger {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-warning {
            background: #fefce8;
            color: #854d0e;
            border: 1px solid #fef08a;
        }

        .alert-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: inherit;
            opacity: 0.4;
            padding: 0 2px;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .alert-close:hover {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #18181b;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            color: #09090b;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #09090b;
            box-shadow: 0 0 0 1px #09090b;
        }

        .form-group input::placeholder {
            color: #a1a1aa;
        }

        .btn-login {
            width: 100%;
            padding: 12px 20px;
            background: #09090b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
            min-height: 44px;
        }

        .btn-login:hover {
            background: #18181b;
        }

        .btn-login:active {
            background: #27272a;
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e4e4e7;
        }

        .catalog-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            transition: color 0.2s;
        }

        .catalog-link:hover {
            color: #09090b;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">NIBRA</div>
            <p class="login-subtitle">Sistema de Gestión Empresarial</p>

            <div class="flash-area">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                <span>{{ message }}</span>
                                <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('public.catalogo') }}" class="catalog-link" target="_blank">
                    <i class="fas fa-store"></i> Ver Catálogo Público
                </a>
            </div>
        </div>
    </div>
</body>
</html>
