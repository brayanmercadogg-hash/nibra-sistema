<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIBRA - Catálogo de Productos</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            color: #0a0a0a;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .catalogo-header {
            text-align: center;
            padding: 4rem 1.5rem 2rem;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
        }
        .catalogo-brand h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #0a0a0a;
        }
        .catalogo-brand p {
            margin-top: 0.375rem;
            color: #a3a3a3;
            font-size: 0.9375rem;
            font-weight: 400;
        }

        .catalogo-filters {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem 0;
        }
        .catalogo-search {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            background: #fff;
            padding: 0.5rem;
            border-radius: 10px;
            border: 1px solid #e5e5e5;
        }
        .catalogo-search-input {
            flex: 1;
            min-width: 200px;
            max-width: 320px;
            padding: 0.625rem 1rem;
            border: 1px solid transparent;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.15s;
            background: #fafafa;
        }
        .catalogo-search-input:focus {
            border-color: #0a0a0a;
            background: #fff;
        }
        .catalogo-search-select {
            padding: 0.625rem 1rem;
            border: 1px solid transparent;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            outline: none;
            background: #fafafa;
            cursor: pointer;
            transition: border-color 0.15s;
            -webkit-appearance: none;
        }
        .catalogo-search-select:focus {
            border-color: #0a0a0a;
            background: #fff;
        }
        .catalogo-search-btn {
            padding: 0.625rem 1.5rem;
            background: #0a0a0a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .catalogo-search-btn:hover {
            background: #262626;
        }

        .catalogo-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }
        .catalogo-card {
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .catalogo-card:hover {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }
        .catalogo-card-image {
            width: 100%;
            height: 220px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #f0f0f0;
        }
        .catalogo-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .catalogo-card-placeholder {
            font-size: 2.5rem;
            color: #e5e5e5;
        }
        .catalogo-card-body {
            padding: 1.25rem;
        }
        .catalogo-card-category {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            background: #f5f5f5;
            color: #737373;
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .catalogo-card-title {
            margin: 0 0 0.25rem;
            font-size: 1rem;
            font-weight: 600;
            color: #0a0a0a;
        }
        .catalogo-card-desc {
            margin: 0;
            color: #a3a3a3;
            font-size: 0.8125rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .catalogo-card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #f5f5f5;
        }
        .catalogo-card-price {
            font-size: 1.125rem;
            font-weight: 700;
            color: #0a0a0a;
        }
        .catalogo-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1.5rem;
            color: #a3a3a3;
        }
        .catalogo-empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #e5e5e5;
        }

        @media (max-width: 900px) {
            .catalogo-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px) {
            .catalogo-grid { grid-template-columns: 1fr; }
            .catalogo-search { flex-direction: column; align-items: stretch; }
            .catalogo-search-input,
            .catalogo-search-select { max-width: 100%; }
            .catalogo-header { padding: 3rem 1.5rem 1.5rem; }
        }
    </style>
</head>
<body>
    <header class="catalogo-header">
        <div class="catalogo-brand">
            <h1>NIBRA</h1>
            <p>Catálogo de productos</p>
        </div>
    </header>

    <div class="catalogo-filters">
        <form method="GET" action="{{ url_for('public.catalogo') }}" class="catalogo-search">
            <input type="text" name="busqueda" class="catalogo-search-input" placeholder="Buscar productos..."
                   value="{{ busqueda }}">
            <select name="categoria_id" class="catalogo-search-select">
                <option value="">Todas las categorías</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}" {% if categoria_seleccionada|string == cat.id|string %}selected{% endif %}>
                    {{ cat.nombre }}
                </option>
                {% endfor %}
            </select>
            <button type="submit" class="catalogo-search-btn"><i class="fas fa-search"></i> Buscar</button>
        </form>
    </div>

    <div class="catalogo-wrapper">
        <div class="catalogo-grid">
            {% for p in productos %}
            <div class="catalogo-card">
                <div class="catalogo-card-image">
                    {% if p.imagen %}
                    <img src="{{ url_for('static', filename='img/uploads/' + p.imagen) }}" alt="{{ p.nombre }}">
                    {% else %}
                    <div class="catalogo-card-placeholder">
                        <i class="fas fa-image"></i>
                    </div>
                    {% endif %}
                </div>
                <div class="catalogo-card-body">
                    <span class="catalogo-card-category">{{ p.categoria_nombre or 'Sin categoría' }}</span>
                    <h3 class="catalogo-card-title">{{ p.nombre }}</h3>
                    <p class="catalogo-card-desc">{{ p.descripcion or '' }}</p>
                    <div class="catalogo-card-footer">
                        <span class="catalogo-card-price">${{ '{:,.2f}'.format(p.precio_venta|float) }}</span>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="catalogo-empty">
                <div class="catalogo-empty-icon"><i class="fas fa-box-open"></i></div>
                <p>No se encontraron productos</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
